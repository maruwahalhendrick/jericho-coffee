<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Polyfork 3D Cup Demo — Jericho Coffee</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/"
    }
  }
  </script>
  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .font-mono {
      font-family: 'JetBrains Mono', monospace;
    }
    .font-serif {
      font-family: 'DM Serif Display', Georgia, serif;
    }
    .glass-panel {
      background: rgba(18, 18, 20, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .btn-pill {
      transition: all 0.2s ease-out;
    }
    .btn-pill.active {
      background: #A85436;
      color: #FFFFFF;
      border-color: #A85436;
      box-shadow: 0 0 16px rgba(168, 84, 54, 0.4);
    }
  </style>
</head>
<body class="bg-[#0D0D11] text-[#E4E4E7] h-screen w-screen overflow-hidden relative">

  <!-- 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 z-0"></div>

  <!-- Top Header Overlay -->
  <header class="absolute top-4 left-4 right-4 z-10 flex justify-between items-start pointer-events-none">
    <div class="glass-panel rounded-2xl px-4 py-3 pointer-events-auto shadow-2xl">
      <div class="flex items-center gap-2 mb-1">
        <a href="index.html" class="inline-flex items-center gap-1.5 text-xs font-mono text-[#A85436] hover:text-[#d46d4a] transition-colors pr-2 border-r border-white/10">
          <span>←</span>
          <span>Vault</span>
        </a>
        <span class="inline-block w-2 h-2 rounded-full bg-[#10B981] animate-pulse"></span>
        <h1 class="text-xs uppercase tracking-widest font-mono text-[#A1A1AA] font-semibold">Jericho × Polyfork 3D</h1>
      </div>
      <p class="text-sm font-serif text-white tracking-wide">Parametric Cup Simulator (12oz)</p>
      <div class="flex items-center gap-3 mt-1 font-mono text-[11px] text-[#71717A]">
        <span>381 Tris</span>
        <span>•</span>
        <span>1 Draw Call</span>
        <span>•</span>
        <span id="fpsCounter" class="text-emerald-400">60 FPS</span>
      </div>
    </div>

    <!-- Quick Tip -->
    <div class="glass-panel rounded-2xl px-3 py-2 pointer-events-auto hidden sm:flex items-center gap-2 font-mono text-xs text-[#A1A1AA]">
      <svg class="w-4 h-4 text-[#A85436]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/></svg>
      <span>Swipe / Drag to Rotate • Pinch / Scroll to Zoom</span>
    </div>
  </header>

  <!-- Bottom Floating Control Deck -->
  <aside class="absolute bottom-4 left-4 right-4 sm:left-auto sm:right-4 sm:w-96 z-10 pointer-events-none">
    <div class="glass-panel rounded-3xl p-4 sm:p-5 pointer-events-auto shadow-2xl border border-white/10 space-y-4">

      <!-- Preset Styles -->
      <div>
        <label class="block text-[11px] uppercase tracking-wider font-mono text-[#A1A1AA] mb-2 font-semibold">Preset Theme</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-colorway="jericho" class="preset-btn btn-pill active px-3 py-2 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 text-center">
            Jericho Clay
          </button>
          <button data-colorway="black-lid" class="preset-btn btn-pill px-3 py-2 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 text-center">
            Black Lid
          </button>
          <button data-colorway="signal-red" class="preset-btn btn-pill px-3 py-2 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 text-center">
            Signal Red
          </button>
        </div>
      </div>

      <!-- Size Selector -->
      <div>
        <label class="block text-[11px] uppercase tracking-wider font-mono text-[#A1A1AA] mb-2 font-semibold">Cup Size</label>
        <div class="grid grid-cols-3 gap-2">
          <button data-size="small" class="size-btn btn-pill px-3 py-2 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 text-center">
            8oz (Small)
          </button>
          <button data-size="regular" class="size-btn btn-pill active px-3 py-2 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 text-center">
            12oz (Std)
          </button>
          <button data-size="large" class="size-btn btn-pill px-3 py-2 rounded-xl text-xs font-medium border border-white/10 bg-white/5 hover:bg-white/10 text-center">
            16oz (Large)
          </button>
        </div>
      </div>

      <!-- Lid Style & Toggle -->
      <div class="flex items-center justify-between pt-1 border-t border-white/10">
        <div>
          <label class="block text-[11px] uppercase tracking-wider font-mono text-[#A1A1AA] mb-1 font-semibold">Tutup Cup (Lid)</label>
          <div class="inline-flex rounded-xl p-1 bg-black/40 border border-white/5 gap-1">
            <button data-lid="domed" class="lid-btn btn-pill active px-2.5 py-1 rounded-lg text-xs font-mono">Domed</button>
            <button data-lid="flat" class="lid-btn btn-pill px-2.5 py-1 rounded-lg text-xs font-mono">Flat</button>
            <button data-lid="none" class="lid-btn btn-pill px-2.5 py-1 rounded-lg text-xs font-mono">None</button>
          </div>
        </div>

        <div class="text-right">
          <label class="block text-[11px] uppercase tracking-wider font-mono text-[#A1A1AA] mb-1 font-semibold">Auto Rotate</label>
          <button id="toggleRotate" class="px-3 py-1.5 rounded-xl text-xs font-mono bg-white/10 text-emerald-400 border border-emerald-500/30 hover:bg-white/20 transition-all">
            ON
          </button>
        </div>
      </div>

    </div>
  </aside>

  <!-- 3D Logic via ES Module -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createAsset } from 'https://polyfork.dev/cdn/takeaway-coffee-cup-1fd6dd.mjs';

    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#0D0D11');

    // Camera setup (real world scale: cup is 12cm tall)
    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 10);
    camera.position.set(0.18, 0.14, 0.22);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Orbit Controls (touch optimized)
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.target.set(0, 0.06, 0);
    controls.minDistance = 0.12;
    controls.maxDistance = 0.5;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 2.0;

    // Lighting
    const hemiLight = new THREE.HemisphereLight('#FFFFFF', '#18181B', 2.2);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight('#FFFFFF', 2.8);
    dirLight.position.set(0.3, 0.5, 0.3);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 0.05;
    dirLight.shadow.camera.far = 1.0;
    dirLight.shadow.bias = -0.001;
    scene.add(dirLight);

    const fillLight = new THREE.PointLight('#A85436', 1.5, 1.0);
    fillLight.position.set(-0.3, 0.15, -0.2);
    scene.add(fillLight);

    // Ground Shadow Plane
    const shadowGeo = new THREE.PlaneGeometry(0.6, 0.6);
    const shadowMat = new THREE.ShadowMaterial({ opacity: 0.35 });
    const shadowPlane = new THREE.Mesh(shadowGeo, shadowMat);
    shadowPlane.rotation.x = -Math.PI / 2;
    shadowPlane.position.y = 0;
    shadowPlane.receiveShadow = true;
    scene.add(shadowPlane);

    // Initial Knobs
    let currentAsset = null;
    let config = {
      theme: 'jericho',
      size: 'regular',
      lidStyle: 'domed'
    };

    function getParamOptions() {
      if (config.theme === 'jericho') {
        return {
          paper: '#F8F5EF',
          sleeve: '#A85436',   // Jericho Terracotta Rust
          print: '#3A180E',
          lid: '#121214',      // Matte Obsidian Lid
          interior: '#2B1A0E',
          size: config.size,
          lidStyle: config.lidStyle,
          sleeveArt: 'plain'
        };
      } else if (config.theme === 'black-lid') {
        return {
          colorway: 'black-lid',
          size: config.size,
          lidStyle: config.lidStyle
        };
      } else {
        return {
          colorway: 'signal-red',
          size: config.size,
          lidStyle: config.lidStyle
        };
      }
    }

    function renderModel() {
      if (currentAsset) {
        scene.remove(currentAsset);
      }
      const opts = getParamOptions();
      currentAsset = createAsset(opts);
      
      currentAsset.traverse(node => {
        if (node.isMesh) {
          node.castShadow = true;
          node.receiveShadow = true;
        }
      });
      scene.add(currentAsset);
    }

    renderModel();

    // UI Listeners: Theme
    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        config.theme = btn.dataset.colorway;
        renderModel();
      });
    });

    // UI Listeners: Size
    document.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.size-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        config.size = btn.dataset.size;
        renderModel();
      });
    });

    // UI Listeners: Lid
    document.querySelectorAll('.lid-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.lid-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        config.lidStyle = btn.dataset.lid;
        renderModel();
      });
    });

    // Auto Rotate Toggle
    const toggleBtn = document.getElementById('toggleRotate');
    toggleBtn.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      toggleBtn.innerText = controls.autoRotate ? 'ON' : 'OFF';
      toggleBtn.className = controls.autoRotate 
        ? 'px-3 py-1.5 rounded-xl text-xs font-mono bg-white/10 text-emerald-400 border border-emerald-500/30' 
        : 'px-3 py-1.5 rounded-xl text-xs font-mono bg-white/5 text-zinc-400 border border-white/10';
    });

    // Responsive Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // FPS Monitor
    let lastTime = performance.now();
    let frames = 0;
    const fpsEl = document.getElementById('fpsCounter');

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);

      frames++;
      const now = performance.now();
      if (now - lastTime >= 1000) {
        fpsEl.textContent = `${frames} FPS`;
        frames = 0;
        lastTime = now;
      }
    }
    animate();
  </script>
</body>
</html>
